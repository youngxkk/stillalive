<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse Check Variants</title>
<style>
  :root { --bg:#F5F4F0; --card:#fff; --ink:#1a1a1a; --muted:#6b6b6b; --line:#e6e3dc; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#141414; --card:#1e1e1e; --ink:#f2f2f2; --muted:#9a9a9a; --line:#2c2c2c; } }
  :root[data-theme="dark"] { --bg:#141414; --card:#1e1e1e; --ink:#f2f2f2; --muted:#9a9a9a; --line:#2c2c2c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 -apple-system, "PingFang SC", system-ui, sans-serif; }
  main { max-width:1200px; margin:0 auto; padding:48px 16px 80px; }
  h1 { font-size:28px; margin:0 0 6px; letter-spacing:-.01em; }
  .sub { color:var(--muted); margin:0 0 36px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:20px; }
  .hero { width:100%; aspect-ratio:1; display:block; border-radius:22%; box-shadow:0 0 0 1px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.08); }
  h2 { font-size:16px; margin:16px 0 4px; }
  p { margin:0; color:var(--muted); font-size:13.5px; }
  .sizes { display:flex; align-items:end; gap:10px; margin-top:14px; padding:12px; border-radius:12px; }
  .sizes.light { background:#eef0f3; } .sizes.dark { background:#1c1c1e; margin-top:8px; }
  .sizes img { border-radius:22%; display:block; }
  .sizes span { white-space:nowrap; font-size:11px; color:#8a8a8e; margin-left:auto; }
  h3 { font-size:15px; margin:48px 0 14px; }
  .row { display:flex; flex-wrap:wrap; gap:18px; padding:24px; border-radius:20px; background:linear-gradient(135deg,#4b6cb7,#182848); }
  .row img { width:64px; height:64px; border-radius:22%; }
</style>
</head>
<body>
<main>
  <h1>心跳对勾 · 优化与配色</h1>
  <p class="sub">在“极简 · 心跳对勾”基础上的 8 个版本。线条加粗、比例调整，并试了不同底色和线色。每张卡下面分别是浅色和深色背景上的 60 / 40 / 29 pt 预览。</p>
  <div class="grid" id="grid"></div>
  <h3>放在主屏壁纸上</h3>
  <div class="row" id="row"></div>
</main>
<script>
const items = [["a-emerald", "A · 翡翠绿（优化原版）", "原方案加粗到 72，脉冲收紧、对勾放大，整体光学居中。最干净的基准版。", "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1024 1024\" width=\"1024\" height=\"1024\"><rect width=\"1024\" height=\"1024\" rx=\"228\" fill=\"#FFFFFF\"/><path d=\"M176 528 H318 L384 376 L458 664 L526 512 L608 598 L848 354\" fill=\"none\" stroke=\"#1D976C\" stroke-width=\"72\" stroke-linecap=\"round\" stroke-linejoin=\"round\" /></svg>"], ["b-emerald-fill", "B · 翡翠绿底反白", "绿色渐变底配白线，主屏上更醒目，和系统“健康”类图标同一个气质。", "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1024 1024\" width=\"1024\" height=\"1024\"><defs><linearGradient id=\"g\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#2BC48A\"/><stop offset=\"1\" stop-color=\"#138A5E\"/></linearGradient></defs><rect width=\"1024\" height=\"1024\" rx=\"228\" fill=\"url(#g)\"/><path d=\"M176 528 H318 L384 376 L458 664 L526 512 L608 598 L848 354\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"72\" stroke-linecap=\"round\" stroke-linejoin=\"round\" /></svg>"], ["c-two-tone", "C · 双色：灰脉冲 + 绿对勾", "脉冲用浅灰，对勾用翡翠绿，强调“从心跳变成 OK”这一刻。", "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1024 1024\" width=\"1024\" height=\"1024\"><rect width=\"1024\" height=\"1024\" rx=\"228\" fill=\"#FFFFFF\"/><path d=\"M176 528 H318 L384 376 L458 664 L526 512\" fill=\"none\" stroke=\"#C9D3CF\" stroke-width=\"72\" stroke-linecap=\"round\" stroke-linejoin=\"round\" /><path d=\"M526 512 L608 598 L848 354\" fill=\"none\" stroke=\"#1D976C\" stroke-width=\"72\" stroke-linecap=\"round\" stroke-linejoin=\"round\" /></svg>"], ["d-gradient", "D · 渐变线条", "线条从青绿过渡到翡翠绿，白底，更有活力，也更像一条“流动”的生命线。", "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1024 1024\" width=\"1024\" height=\"1024\"><defs><linearGradient id=\"s\" gradientUnits=\"userSpaceOnUse\" x1=\"176\" y1=\"0\" x2=\"848\" y2=\"0\"><stop offset=\"0\" stop-color=\"#20C3D0\"/><stop offset=\"1\" stop-color=\"#16B26B\"/></linearGradient></defs><rect width=\"1024\" height=\"1024\" rx=\"228\" fill=\"#FFFFFF\"/><path d=\"M176 528 H318 L384 376 L458 664 L526 512 L608 598 L848 354\" fill=\"none\" stroke=\"url(#s)\" stroke-width=\"72\" stroke-linecap=\"round\" stroke-linejoin=\"round\" /></svg>"], ["e-night-neon", "E · 深夜霓虹", "App 里的深夜蓝底配荧光绿，带一点外发光，适合作为深色模式图标。", "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1024 1024\" width=\"1024\" height=\"1024\"><defs><linearGradient id=\"g\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#132A33\"/><stop offset=\"1\" stop-color=\"#0B171C\"/></linearGradient><filter id=\"glow\" x=\"-20%\" y=\"-40%\" width=\"140%\" height=\"180%\"><feGaussianBlur stdDeviation=\"22\"/></filter></defs><rect width=\"1024\" height=\"1024\" rx=\"228\" fill=\"url(#g)\"/><path d=\"M176 528 H318 L384 376 L458 664 L526 512 L608 598 L848 354\" fill=\"none\" stroke=\"#00F260\" stroke-width=\"72\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".55\" filter=\"url(#glow)\"/><path d=\"M176 528 H318 L384 376 L458 664 L526 512 L608 598 L848 354\" fill=\"none\" stroke=\"#3DFF8A\" stroke-width=\"72\" stroke-linecap=\"round\" stroke-linejoin=\"round\" /></svg>"], ["f-mint", "F · 薄荷底深绿线", "浅薄荷底配深松绿线条，比纯白底柔和，和白色背景的 App Store 页面也能分开。", "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1024 1024\" width=\"1024\" height=\"1024\"><rect width=\"1024\" height=\"1024\" rx=\"228\" fill=\"#E3F6EC\"/><path d=\"M176 528 H318 L384 376 L458 664 L526 512 L608 598 L848 354\" fill=\"none\" stroke=\"#0E6B4A\" stroke-width=\"72\" stroke-linecap=\"round\" stroke-linejoin=\"round\" /></svg>"], ["g-coral", "G · 暖珊瑚", "奶油底配珊瑚红线，更温暖、更有“关心”的感觉，和绿色系拉开差异。", "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1024 1024\" width=\"1024\" height=\"1024\"><rect width=\"1024\" height=\"1024\" rx=\"228\" fill=\"#FFF4EC\"/><path d=\"M176 528 H318 L384 376 L458 664 L526 512 L608 598 L848 354\" fill=\"none\" stroke=\"#FF5A3C\" stroke-width=\"72\" stroke-linecap=\"round\" stroke-linejoin=\"round\" /></svg>"], ["h-bold-compact", "H · 紧凑加粗版", "去掉前面的平直段，线宽 88，对勾占满画面，29pt 下最清楚。蓝底白线。", "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1024 1024\" width=\"1024\" height=\"1024\"><defs><linearGradient id=\"g\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#3B82F6\"/><stop offset=\"1\" stop-color=\"#1D4ED8\"/></linearGradient></defs><rect width=\"1024\" height=\"1024\" rx=\"228\" fill=\"url(#g)\"/><path d=\"M180 520 L268 360 L360 680 L440 500 L540 610 L844 300\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"88\" stroke-linecap=\"round\" stroke-linejoin=\"round\" /></svg>"]];
const uri = s => "data:image/svg+xml;charset=utf-8," + encodeURIComponent(s);
const sizes = (src, cls) => `<div class="sizes ${cls}"><img src="${src}" width="60" height="60" alt=""><img src="${src}" width="40" height="40" alt=""><img src="${src}" width="29" height="29" alt=""><span>60 · 40 · 29</span></div>`;
const grid = document.getElementById("grid"), row = document.getElementById("row");
for (const [key, name, desc, svg] of items) {
  const src = uri(svg);
  grid.insertAdjacentHTML("beforeend", `<article class="card"><img class="hero" src="${src}" alt="${name}"><h2>${name}</h2><p>${desc}</p>${sizes(src, "light")}${sizes(src, "dark")}</article>`);
  row.insertAdjacentHTML("beforeend", `<img src="${src}" alt="${name}" title="${name}">`);
}
</script>
</body>
</html>
